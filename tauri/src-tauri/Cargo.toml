[package]
name = "recurse"
version = "0.1.0"
description = "Agentic reverse engineering environment"
authors = ["Aayush Khanna"]
license = "Apache-2.0"
edition = "2021"
default-run = "recurse"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recurse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Independent agent framework (LLM loop, tool runtime). No Tauri
# dependency, no config/storage access — builds and tests standalone.
recurse-agent = { path = "../../crates/recurse-agent" }
# Direct dependency (not just via recurse-agent's re-export) for the host-
# side findings/diff/hex-patch/call-graph glue, which needs modules
# recurse-agent deliberately does not re-export (capa, cpp, diff, driver,
# dwarf, firmware, semantic_memory, sig — it only needs `engine`/`native`).
recurse-static = { path = "../../crates/recurse-static" }
recurse-debug = { path = "../../crates/recurse-debug" }
# sync primitives only (Mutex); the async runtime comes from Tauri.
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ureq = { version = "2", features = ["tls", "json"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
glob = "0.3"
# Recon page: file hashes and checksum.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
regex = "1"
walkdir = "2"
wait-timeout = "0.2"
# Project export/import (zip a project's files + metadata for handoff).
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
glib = "0.18"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness-sensitive codebase (locks, signals, subprocesses): no silent
# panics on poisoned locks or bad UTF-8 from external processes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

